# Deploy getproperty-liff on Collective's shared AWS platform (D-230; getproperty-api docs/deployment.md §7, ADR-0007)
# through collective-infra's reusable workflows, exactly like getproperty-web: main → build the arm64 image
# getproperty/liff:sha-… + :uat → deploy UAT · tag vX.Y.Z → build :prod → deploy production (approval through the
# GitHub Environment `production`). `component: liff` makes the box record LIFF_IMAGE_TAG, pull and restart only the
# `liff` service, health-check it and roll back only that image; no migration (the api image owns them).
#
# The image takes no build arguments: every environment value — the LIFF id of that environment's LINE channel, the
# VAPID public key, the browser's Sentry DSN, the env badge, the asset origin — is read at run time from the secret
# `collective/<env>/getproperty/liff` (→ /run/collective/getproperty-liff.env), so collective-infra's `promote.yml`
# can ship the bytes that passed UAT to production instead of rebuilding (`--component liff`). No repository
# variables are needed. A production container without NEXT_PUBLIC_LIFF_ID fails its start-up check (src/lib/env.ts)
# and answers 500 everywhere, /api/healthz included, so the platform's health check fails and the deploy rolls back
# instead of serving a LIFF that cannot sign anyone in.
#
# Needs collective-infra at a tag with the getproperty/r1-platform changes (component deploys) — `@v1` below until that
# tag is cut — and the GitHub Environments `uat` / `production` with AWS_DEPLOY_ROLE_ARN, INSTANCE_ID,
# AWS_REGION=ap-southeast-7 (collective-infra README §3.4). The api image must have been deployed once first.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-uat:
    if: github.ref == 'refs/heads/main'
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: getproperty/liff
      environment: uat
      moving_tag: uat

  deploy-uat:
    needs: build-uat
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: liff
      migrate: false
      environment: uat
      image_tag: ${{ needs.build-uat.outputs.image_tag }}

  build-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: getproperty/liff
      environment: production
      moving_tag: prod

  deploy-prod:
    needs: build-prod
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: liff
      migrate: false
      environment: production
      image_tag: ${{ needs.build-prod.outputs.image_tag }}
