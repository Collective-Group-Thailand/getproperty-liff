# Deploy getproperty-liff on Collective's shared AWS platform (D-230; getproperty-api docs/deployment.md §7, ADR-0007).
# main → image getproperty/liff:sha-… + :uat → deploy uat; tag vX.Y.Z → :prod → deploy production (approval through
# the GitHub Environment `production`). `component: liff` makes the box record LIFF_IMAGE_TAG and roll back only this
# image; no migration (the api image owns them).
#
# Environments `uat` / `production` hold AWS_DEPLOY_ROLE_ARN, INSTANCE_ID, AWS_REGION=ap-southeast-7 (as for the api).
# The NEXT_PUBLIC_* values are inlined at build time, so each environment builds its own image from repository
# variables (a caller cannot read Environment variables in `with:`):
#   UAT_LIFF_ID / PROD_LIFF_ID                  LIFF app id of that environment's LINE Login channel (required)
#   UAT_LINE_OA_ID / PROD_LINE_OA_ID            LINE Official Account id, e.g. @getproperty
#   UAT_VAPID_PUBLIC_KEY / PROD_VAPID_PUBLIC_KEY  web push application server key (the api's WEB_PUSH_VAPID_PUBLIC_KEY)
#   UAT_SENTRY_DSN / PROD_SENTRY_DSN            browser error reporting (optional)
# The asset origin is the product bucket of the environment (collective-<env>-getproperty-assets).
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: { id-token: write, contents: read, packages: read }

jobs:
  # A front end built without its LIFF id would deploy fine and fail for every resident: refuse before building.
  config:
    runs-on: ubuntu-latest
    steps:
      - name: Public build configuration is set
        env:
          LIFF_ID: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_LIFF_ID || vars.UAT_LIFF_ID }}
          LINE_OA_ID: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_LINE_OA_ID || vars.UAT_LINE_OA_ID }}
        run: |
          [ -n "$LIFF_ID" ] || { echo "::error::repository variable UAT_LIFF_ID / PROD_LIFF_ID is not set"; exit 1; }
          [[ "$LIFF_ID" =~ ^[0-9]+-[A-Za-z0-9]+$ ]] || { echo "::error::the LIFF id does not look like 1234567890-AbCdEfGh"; exit 1; }
          [ -z "$LINE_OA_ID" ] || [[ "$LINE_OA_ID" =~ ^@[A-Za-z0-9._-]+$ ]] || { echo "::error::the LINE OA id must look like @getproperty"; exit 1; }

  build-uat:
    needs: config
    if: github.ref == 'refs/heads/main'
    uses: collective-group/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: getproperty/liff
      environment: uat
      moving_tag: uat
      build_args: |
        NEXT_PUBLIC_LIFF_ID=${{ vars.UAT_LIFF_ID }}
        NEXT_PUBLIC_LINE_OA_ID=${{ vars.UAT_LINE_OA_ID }}
        NEXT_PUBLIC_ASSET_BASE_URL=https://collective-uat-getproperty-assets.s3.ap-southeast-7.amazonaws.com
        NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.UAT_VAPID_PUBLIC_KEY }}
        NEXT_PUBLIC_SENTRY_DSN=${{ vars.UAT_SENTRY_DSN }}
        NEXT_PUBLIC_ENV_BADGE=uat
  deploy-uat:
    needs: build-uat
    uses: collective-group/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: liff
      migrate: false
      environment: uat
      image_tag: ${{ needs.build-uat.outputs.image_tag }}

  build-prod:
    needs: config
    if: startsWith(github.ref, 'refs/tags/v')
    uses: collective-group/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: getproperty/liff
      environment: production
      moving_tag: prod
      build_args: |
        NEXT_PUBLIC_LIFF_ID=${{ vars.PROD_LIFF_ID }}
        NEXT_PUBLIC_LINE_OA_ID=${{ vars.PROD_LINE_OA_ID }}
        NEXT_PUBLIC_ASSET_BASE_URL=https://collective-prod-getproperty-assets.s3.ap-southeast-7.amazonaws.com
        NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.PROD_VAPID_PUBLIC_KEY }}
        NEXT_PUBLIC_SENTRY_DSN=${{ vars.PROD_SENTRY_DSN }}
  deploy-prod:
    needs: build-prod
    uses: collective-group/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: liff
      migrate: false
      environment: production
      image_tag: ${{ needs.build-prod.outputs.image_tag }}
