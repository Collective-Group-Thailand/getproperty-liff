name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # The generated CSS and the copied font files are committed; a stale copy must fail here.
      - name: Design tokens are up to date
        run: pnpm tokens:check
      - name: Font files match the installed packages
        run: pnpm fonts --check
      - name: Icon glyphs match the curated set (D-179)
        run: pnpm icons:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Generated API types and mocks match the pinned contract
        run: pnpm gen:api --check
      # Includes the WCAG 2.2 AA contrast gate, axe over every copied Storybook story, the LIFF wrapper
      # and fake, the formatter tests and the ESLint rule fixture.
      - name: Unit tests
        run: pnpm test
      # A production build: no NEXT_PUBLIC_LIFF_MOCK, so the fake LIFF must not be in the bundle.
      - name: Build
        run: pnpm build
      - name: Release hygiene (no mock, fake LIFF or debug traces in the build)
        run: pnpm release:hygiene

  e2e:
    name: e2e (360×780, fake LIFF, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (builds with NEXT_PUBLIC_LIFF_MOCK=1 and starts the app itself)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14

  # Shared copies: warn-only drift report against getproperty-web (D-155). Checks the source out
  # inside the workspace; skipped quietly when the repository variable is not configured.
  shared-copies:
    name: shared copies (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.GETPROPERTY_WEB_REPO != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.GETPROPERTY_WEB_REPO }}
          path: .shared-source/getproperty-web
          token: ${{ secrets.GETPROPERTY_WEB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm shared:check
        env:
          SHARED_SOURCE: .shared-source/getproperty-web

  # Contract drift (ADR-0005): the vendored contract matches contract.lock.json (sha256 + source commit), and
  # schema.d.ts / operations / MSW tables are regenerated byte for byte. Bumping the contract is a PR that runs
  # `pnpm gen:api --adopt` against getproperty-api's release.
  contract:
    name: contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api --check

  visual:
    name: storybook visual snapshots (shell)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-storybook
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7

  lighthouse:
    name: lighthouse (mock build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with the fake LIFF
        run: pnpm build
        env:
          NEXT_PUBLIC_LIFF_MOCK: "1"
      - name: Lighthouse budgets (resident, public)
        run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  # Against the real getproperty-api (fake LINE verifier, PostgreSQL from its `pnpm db:local`). Needs the API and
  # collective-asset-core repositories as siblings; skipped quietly when the repository variables are not set.
  integration:
    name: integration (real API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.GETPROPERTY_API_REPO != '' && vars.COLLECTIVE_ASSET_CORE_REPO != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: getproperty-liff
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.GETPROPERTY_API_REPO }}
          path: getproperty-api
          token: ${{ secrets.GETPROPERTY_API_TOKEN }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.COLLECTIVE_ASSET_CORE_REPO }}
          path: collective-asset-core
          token: ${{ secrets.GETPROPERTY_API_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: getproperty-liff/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: getproperty-liff/.nvmrc
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: collective-asset-core
      - run: pnpm install --frozen-lockfile && pnpm build:fast
        working-directory: getproperty-api
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: getproperty-liff
      - run: pnpm e2e:integration
        working-directory: getproperty-liff
