name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # The generated CSS and the copied font files are committed; a stale copy must fail here.
      - name: Design tokens are up to date
        run: pnpm tokens:check
      - name: Font files match the installed packages
        run: pnpm fonts --check
      - name: Script fonts (my/km/lo/zh) match the packages and the zh copy (L4, D-064)
        run: pnpm fonts:scripts:check
      - name: Icon glyphs match the curated set (D-179)
        run: pnpm icons:check
      - name: Brand outputs (LINE MINI App icon, offline page logo) match the founder's logo
        run: pnpm brand:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Generated API types and mocks match the pinned contract
        run: pnpm gen:api --check
      # Includes the WCAG 2.2 AA contrast gate, axe over every copied Storybook story, the LIFF wrapper
      # and fake, the formatter tests and the ESLint rule fixture.
      - name: Unit tests
        run: pnpm test
      # A production build: no NEXT_PUBLIC_LIFF_MOCK, so the fake LIFF must not be in the bundle.
      - name: Build
        run: pnpm build
      - name: Release hygiene (no mock, fake LIFF or debug traces in the build)
        run: pnpm release:hygiene

  e2e:
    name: e2e (360×780, fake LIFF, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (builds with NEXT_PUBLIC_LIFF_MOCK=1 and starts the app itself)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The platform image (D-230, ADR-0007): built without build arguments, then started twice with two different LIFF
  # ids — the one image must serve each environment's id (collective-infra promote.yml ships the UAT bytes to
  # production).
  image:
    name: image (docker build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: getproperty/liff:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke (healthz, metrics, TZ, run-time LIFF id, unhealthy without one)
        run: |
          start() {
            docker run -d --name "$1" -e API_INTERNAL_URL=http://getproperty-api:3000 -e TRUSTED_HOPS=1 \
              -e NEXT_PUBLIC_LIFF_ID="$2" -e NEXT_PUBLIC_ENV_BADGE="$3" getproperty/liff:ci
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = healthy ] && break; sleep 2
            done
            docker inspect -f '{{.State.Health.Status}}' "$1" | grep -qx healthy
          }
          start uat 2000000000-uatChannel uat
          start prod 2000000001-prodChannel production
          docker exec uat wget -qO- http://127.0.0.1:3000/api/metrics | grep -q 'service="getproperty-liff"'
          docker exec uat node -e 'console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)' | grep -qx Asia/Bangkok
          # No API here: the sign-in page needs none. Each container stamps its own environment's id.
          docker exec uat wget -qO- http://127.0.0.1:3000/auth | grep -q 'data-liff-id="2000000000-uatChannel"'
          docker exec prod wget -qO- http://127.0.0.1:3000/auth | grep -q 'data-liff-id="2000000001-prodChannel"'
          ! docker exec prod wget -qO- http://127.0.0.1:3000/auth | grep -q 'data-env='
          # Neither id is in the image's client chunks.
          ! docker exec uat grep -rqs -e 2000000000-uatChannel -e 2000000001-prodChannel /app/.next/static
          # Without its LIFF id a production container fails its start-up check (src/lib/env.ts): every request, the
          # health check included, answers 500, so a platform deploy rolls back.
          docker run -d --name noliff -e API_INTERNAL_URL=http://getproperty-api:3000 getproperty/liff:ci
          sleep 15
          docker logs noliff 2>&1 | grep -q 'NEXT_PUBLIC_LIFF_ID: required in production'
      - if: failure()
        run: docker logs uat; docker logs prod; docker logs noliff || true

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14

  # Shared copies: warn-only drift report against getproperty-web (D-155). Checks the source out
  # inside the workspace; skipped quietly when the repository variable is not configured.
  shared-copies:
    name: shared copies (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.GETPROPERTY_WEB_REPO != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.GETPROPERTY_WEB_REPO }}
          path: .shared-source/getproperty-web
          token: ${{ secrets.GETPROPERTY_WEB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm shared:check
        env:
          SHARED_SOURCE: .shared-source/getproperty-web

  # Contract drift (ADR-0005): the vendored contract matches contract.lock.json (sha256 + source commit), and
  # schema.d.ts / operations / MSW tables are regenerated byte for byte. Bumping the contract is a PR that runs
  # `pnpm gen:api --adopt` against getproperty-api's release.
  contract:
    name: contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api --check

  visual:
    name: storybook visual snapshots (shell)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-storybook
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7

  # Every set, split into shards that run in parallel (`LHCI_SHARD`, balanced by URL count in scripts/lhci.ts):
  # one runner took ~35 s a URL and the sets outgrew the job's timeout.
  lighthouse:
    name: lighthouse (mock build, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with the fake LIFF
        run: pnpm build
        env:
          NEXT_PUBLIC_LIFF_MOCK: "1"
      - name: Lighthouse budgets
        run: pnpm lhci
        env:
          LHCI_SHARD: ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.shard }}
          path: .lighthouseci
          retention-days: 14

  # Against the real getproperty-api (fake LINE verifier, PostgreSQL from its `pnpm db:local`). Needs the API and
  # collective-asset-core repositories as siblings; skipped quietly when the repository variables are not set.
  integration:
    name: integration (real API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.GETPROPERTY_API_REPO != '' && vars.COLLECTIVE_ASSET_CORE_REPO != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: getproperty-liff
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.GETPROPERTY_API_REPO }}
          path: getproperty-api
          token: ${{ secrets.GETPROPERTY_API_TOKEN }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.COLLECTIVE_ASSET_CORE_REPO }}
          path: collective-asset-core
          token: ${{ secrets.GETPROPERTY_API_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: getproperty-liff/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: getproperty-liff/.nvmrc
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: collective-asset-core
      - run: pnpm install --frozen-lockfile && pnpm build:fast
        working-directory: getproperty-api
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: getproperty-liff
      - run: pnpm e2e:integration
        working-directory: getproperty-liff
