name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # The generated CSS and the copied font files are committed; a stale copy must fail here.
      - name: Design tokens are up to date
        run: pnpm tokens:check
      - name: Font files match the installed packages
        run: pnpm fonts --check
      - name: Typecheck
        run: pnpm typecheck
      # Includes the WCAG 2.2 AA contrast gate, axe over every copied Storybook story, the LIFF wrapper
      # and fake, the formatter tests and the ESLint rule fixture.
      - name: Unit tests
        run: pnpm test
      # A production build: no NEXT_PUBLIC_LIFF_MOCK, so the fake LIFF must not be in the bundle.
      - name: Build
        run: pnpm build
      - name: Release hygiene (no mock, fake LIFF or debug traces in the build)
        run: pnpm release:hygiene

  e2e:
    name: e2e (360×780, fake LIFF, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (builds with NEXT_PUBLIC_LIFF_MOCK=1 and starts the app itself)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14

  # Shared copies: warn-only drift report against getproperty-web (D-155). Checks the source out
  # inside the workspace; skipped quietly when the repository variable is not configured.
  shared-copies:
    name: shared copies (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.GETPROPERTY_WEB_REPO != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.GETPROPERTY_WEB_REPO }}
          path: .shared-source/getproperty-web
          token: ${{ secrets.GETPROPERTY_WEB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm shared:check
        env:
          SHARED_SOURCE: .shared-source/getproperty-web

  # L1 adds: `contract` (pnpm gen:api --check against contract.lock.json) and `lighthouse` (pnpm lhci,
  # built with NEXT_PUBLIC_LIFF_MOCK=1).
